<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grosmen News</title>

<link rel="icon" href="news-faivcon.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>

<style>
body{
  margin:0;
  font-family:'Cairo';
  background:#050505;
  color:white;
}

/* HEADER */
.main-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 25px;
  position:sticky;
  top:0;
  background:rgba(0,0,0,0.6);
  backdrop-filter:blur(10px);
}

/* MENU ICON */
.apps-menu-btn{
  display:grid;
  grid-template-columns:repeat(3,5px);
  gap:4px;
  cursor:pointer;
}
.dot{
  width:5px;height:5px;
  background:white;
  border-radius:50%;
}

/* DROPDOWN */
.apps-dropdown{
  position:absolute;
  top:70px;
  left:20px;
  background:#111;
  border:1px solid #333;
  padding:15px;
  border-radius:12px;
  display:none;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  z-index:999;
}
.apps-dropdown.active{display:grid;}

.app-item{
  text-align:center;
  font-size:12px;
  color:white;
  text-decoration:none;
}
.app-item img{
  width:55px;
  height:55px;
  margin-bottom:5px;
}

/* NEWS */
.news-container{
  max-width:800px;
  margin:auto;
  padding:20px;
}

.news-card{
  background:#111;
  padding:15px;
  margin-bottom:15px;
  border-radius:10px;
}

/* LOGIN */
.login-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.85);
  display:flex;
  justify-content:center;
  align-items:center;
}
.login-box{
  background:#111;
  padding:20px;
  border-radius:12px;
  width:300px;
}
input,textarea{
  width:100%;
  margin:5px 0;
  padding:8px;
  background:#000;
  border:1px solid #333;
  color:white;
}
button{
  padding:8px;
  background:#e74c3c;
  border:none;
  color:white;
  cursor:pointer;
}
</style>

</head>

<body>

<div id="app">

<!-- HEADER -->
<header class="main-header">

<!-- MENU (رجعت نفس التصميم + الروابط الأصلية) -->
<div>
  <div class="apps-menu-btn" @click="menu=!menu">
    <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    <div class="dot"></div><div class="dot"></div><div class="dot"></div>
  </div>

  <div class="apps-dropdown" :class="{active:menu}">

    <a href="https://bacmaroc.ivanova.sbs" class="app-item">
      <img src="bacmaroc-ovcon.png">
      <div>Bac Maroc</div>
    </a>

    <a href="https://courses.ivanova.sbs" class="app-item">
      <img src="courses-ovcon.png">
      <div>Courses</div>
    </a>

    <a href="https://wikijobs.ivanova.sbs" class="app-item">
      <img src="wikijobs-ovcon.png">
      <div>WikiJobs</div>
    </a>

    <a href="https://store.ivanova.sbs" class="app-item">
      <img src="store-ovcon.png">
      <div>Store</div>
    </a>

    <a href="javascript:location.reload()" class="app-item">
      <img src="news-ovcon.png">
      <div>News</div>
    </a>

  </div>
</div>

<h3>Grosmen News</h3>

<button v-if="!dev" @click="login=true">دخول</button>
<button v-else @click="logout">خروج</button>

</header>

<!-- LOGIN -->
<div v-if="login" class="login-overlay">
  <div class="login-box">
    <h3>تسجيل دخول</h3>

    <input v-model="user" placeholder="username">
    <input v-model="pass" type="password" placeholder="pass_code">

    <p style="color:red" v-if="error">{{error}}</p>

    <button @click="doLogin">دخول</button>
    <button @click="login=false" style="background:#333;margin-top:5px">إغلاق</button>
  </div>
</div>

<!-- NEWS -->
<main class="news-container">

<div v-if="dev">
  <h3>لوحة المطور</h3>
  <input v-model="title" placeholder="عنوان">
  <input v-model="image" placeholder="صورة">
  <textarea v-model="content" placeholder="محتوى"></textarea>
  <button @click="publish">نشر</button>
</div>

<div v-for="n in news" class="news-card">
  <img v-if="n.image_url" :src="n.image_url" style="width:100%">
  <h3>{{n.title}}</h3>
  <p>{{n.content}}</p>
  <small>{{n.author_name}}</small>
</div>

</main>

</div>

<script>
const app = Vue.createApp({

data(){
return{
  WORKER:"https://ivanova-news.vladimirachraf3.workers.dev",

  menu:false,

  login:false,
  user:"",
  pass:"",
  error:"",

  dev:localStorage.getItem("dev"),

  title:"",
  image:"",
  content:"",

  news:[]
}
},

mounted(){
this.load();
},

methods:{

async api(url,options={}){
  const r = await fetch(this.WORKER+url,{
    headers:{"Content-Type":"application/json"},
    ...options
  });

  if(!r.ok) throw new Error();
  return await r.json();
},

async load(){
  this.news = await this.api("/api/news");
},

async doLogin(){
  try{
    await this.api("/api/login",{
      method:"POST",
      body:JSON.stringify({
        username:this.user,
        pass_code:this.pass
      })
    });

    localStorage.setItem("dev",this.user);
    this.dev=this.user;
    this.login=false;

  }catch{
    this.error="خطأ في البيانات";
  }
},

logout(){
  localStorage.removeItem("dev");
  this.dev=null;
},

async publish(){
  await this.api("/api/news/add",{
    method:"POST",
    body:JSON.stringify({
      title:this.title,
      content:this.content,
      image_url:this.image,
      author:this.dev
    })
  });

  this.load();
}

}

}).mount("#app");
</script>

</body>
</html>
