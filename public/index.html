<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grosmen News | الاخبار الدولية</title>

<link rel="icon" href="news-faivcon.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>

<style>
body{
  margin:0;
  font-family:'Cairo',sans-serif;
  background:#050505;
  color:white;
  display:flex;
  flex-direction:column;
  min-height:100vh;
}

.glass-effect{
  background:rgba(255,255,255,0.03);
  backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(255,255,255,0.05);
}

.main-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 30px;
  position:sticky;
  top:0;
  z-index:1000;
}

.header-logo{width:150px}

/* News */
.news-container{
  max-width:800px;
  margin:40px auto;
  padding:0 20px;
}

.news-card{
  background:rgba(255,255,255,0.02);
  padding:20px;
  margin-bottom:20px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,0.05);
}

.news-card img{
  max-width:100%;
  border-radius:10px;
  margin-bottom:10px;
}

/* Dev */
.dev-tools{
  display:block;
  background:#0a0a0a;
  padding:20px;
  border-radius:12px;
  margin-bottom:20px;
  border:1px solid #222;
}

input,textarea{
  width:100%;
  margin-bottom:10px;
  padding:10px;
  background:#000;
  border:1px solid #333;
  color:white;
  border-radius:8px;
}

/* Login */
.login-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.8);
  backdrop-filter:blur(10px);
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

.login-box{
  width:320px;
  background:#111;
  padding:25px;
  border-radius:15px;
  border:1px solid #333;
  display:flex;
  flex-direction:column;
  gap:10px;
}

button{
  padding:10px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  background:#e74c3c;
  color:white;
}
</style>

</head>

<body>

<div id="app">

<!-- HEADER -->
<header class="main-header glass-effect">
  <img class="header-logo" src="grosmen-fivcon.png">

  <button v-if="!dev" @click="login.show=true">
    دخول
  </button>

  <button v-else @click="logout">
    خروج
  </button>
</header>

<!-- LOGIN -->
<div v-if="login.show" class="login-overlay">
  <div class="login-box">
    <h3>تسجيل دخول المطور</h3>

    <input v-model="login.username" placeholder="username">
    <input v-model="login.pass_code" placeholder="password" type="password">

    <p style="color:#ff5555" v-if="login.error">{{login.error}}</p>

    <button @click="doLogin">دخول</button>
    <button @click="login.show=false" style="background:#333">إغلاق</button>
  </div>
</div>

<!-- MAIN -->
<main class="news-container">

<!-- DEV PANEL -->
<div v-if="dev" class="dev-tools">
  <h3>لوحة التحرير</h3>

  <input id="title" placeholder="عنوان">
  <input id="image" placeholder="صورة">
  <textarea id="content" placeholder="محتوى"></textarea>

  <button @click="publish">نشر</button>
</div>

<!-- NEWS -->
<div v-if="loading">جاري التحميل...</div>

<div v-for="n in news" class="news-card">
  <img v-if="n.image_url" :src="n.image_url">
  <h2>{{n.title}}</h2>
  <p>{{n.content}}</p>

  <small>✍ {{n.author_name}}</small>

  <button v-if="dev" @click="remove(n.id)">
    حذف
  </button>
</div>

</main>

</div>

<script>
const { createApp } = Vue;

createApp({
data(){
return{
  WORKER_URL:"https://ivanova-news.vladimirachraf3.workers.dev",

  news:[],
  loading:true,

  dev:localStorage.getItem("grosmen_dev"),

  login:{
    show:false,
    username:"",
    pass_code:"",
    error:""
  }
}
},

mounted(){
this.fetchNews();
},

methods:{

async api(path,options={}){
  const r = await fetch(this.WORKER_URL+path,{
    headers:{"Content-Type":"application/json"},
    ...options
  });

  if(!r.ok) throw new Error();
  return await r.json();
},

async fetchNews(){
  try{
    this.news = await this.api("/api/news");
  }catch(e){
    console.log(e);
  }
  this.loading=false;
},

async doLogin(){
  try{
    await this.api("/api/login",{
      method:"POST",
      body:JSON.stringify({
        username:this.login.username,
        pass_code:this.login.pass_code
      })
    });

    localStorage.setItem("grosmen_dev",this.login.username);
    this.dev=this.login.username;
    this.login.show=false;

  }catch{
    this.login.error="خطأ في البيانات";
  }
},

logout(){
  localStorage.removeItem("grosmen_dev");
  this.dev=null;
},

async publish(){
  await this.api("/api/news/add",{
    method:"POST",
    body:JSON.stringify({
      title:document.getElementById("title").value,
      content:document.getElementById("content").value,
      image_url:document.getElementById("image").value,
      author:this.dev
    })
  });

  this.fetchNews();
},

async remove(id){
  await this.api("/api/news/delete",{
    method:"DELETE",
    body:JSON.stringify({id})
  });

  this.fetchNews();
}

}

}).mount("#app");
</script>

</body>
</html>
