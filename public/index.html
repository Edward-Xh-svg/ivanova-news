<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Grosmen News | الاخبار الدولية</title>

<link rel="icon" href="news-faivcon.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>

<style>
body{
  margin:0;
  font-family:'Cairo',sans-serif;
  background:#050505;
  color:white;
  min-height:100vh;
}

/* HEADER */
.main-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 30px;
  position:sticky;
  top:0;
  background:rgba(0,0,0,0.6);
  backdrop-filter:blur(10px);
  z-index:1000;
}

.header-logo{
  width:150px;
}

/* APPS MENU */
.apps-menu-btn{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:4px;
  cursor:pointer;
  padding:10px;
}

.dot{
  width:5px;
  height:5px;
  background:white;
  border-radius:50%;
}

.apps-dropdown{
  position:absolute;
  top:70px;
  left:20px;
  background:#0a0a0a;
  border:1px solid #222;
  border-radius:15px;
  padding:20px;
  display:none;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}

.apps-dropdown.active{
  display:grid;
}

.app-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  color:white;
  text-decoration:none;
  font-size:12px;
}

.app-item img{
  width:50px;
  height:50px;
}

/* MAIN */
.news-container{
  max-width:800px;
  margin:40px auto;
  padding:0 20px;
}

/* NEWS */
.news-card{
  background:#0c0c0c;
  padding:20px;
  margin-bottom:20px;
  border-radius:12px;
  border:1px solid #222;
}

.news-card img{
  max-width:100%;
  border-radius:10px;
}

/* DEV */
.dev-tools{
  background:#111;
  padding:20px;
  border-radius:12px;
  margin-bottom:20px;
}

input,textarea{
  width:100%;
  padding:10px;
  margin-bottom:10px;
  background:#000;
  border:1px solid #333;
  color:white;
  border-radius:8px;
}

/* LOGIN */
.login-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.8);
  backdrop-filter:blur(10px);
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

.login-box{
  width:320px;
  background:#111;
  padding:25px;
  border-radius:15px;
  border:1px solid #333;
}

button{
  padding:10px;
  background:#e74c3c;
  border:none;
  color:white;
  border-radius:8px;
  cursor:pointer;
}
</style>

</head>

<body>

<div id="app">

<!-- HEADER -->
<header class="main-header">

<!-- APPS -->
<div class="apps-menu-btn" onclick="toggleAppsMenu()">
  <div class="dot"></div><div class="dot"></div><div class="dot"></div>
  <div class="dot"></div><div class="dot"></div><div class="dot"></div>
  <div class="dot"></div><div class="dot"></div><div class="dot"></div>
</div>

<img class="header-logo" src="grosmen-fivcon.png">

<button v-if="!dev" @click="login.show=true">دخول</button>
<button v-else @click="logout">خروج</button>

</header>

<!-- APPS DROPDOWN -->
<div class="apps-dropdown" id="appsDropdown">
  <a class="app-item" href="https://bacmaroc.ivanova.sbs">
    <img src="bacmaroc-ovcon.png"><span>Bac Maroc</span>
  </a>

  <a class="app-item" href="https://courses.ivanova.sbs">
    <img src="courses-ovcon.png"><span>Courses</span>
  </a>

  <a class="app-item" href="https://wikijobs.ivanova.sbs">
    <img src="wikijobs-ovcon.png"><span>WikiJobs</span>
  </a>

  <a class="app-item" href="https://store.ivanova.sbs">
    <img src="store-ovcon.png"><span>Store</span>
  </a>

  <a class="app-item">
    <img src="news-ovcon.png"><span>News</span>
  </a>
</div>

<!-- LOGIN -->
<div v-if="login.show" class="login-overlay">
  <div class="login-box">
    <h3>تسجيل دخول</h3>

    <input v-model="login.username" placeholder="username">
    <input v-model="login.pass_code" type="password" placeholder="password">

    <p style="color:red" v-if="login.error">{{login.error}}</p>

    <button @click="doLogin">دخول</button>
    <button @click="login.show=false" style="background:#333;margin-top:10px">إغلاق</button>
  </div>
</div>

<!-- MAIN -->
<main class="news-container">

<!-- DEV -->
<div v-if="dev" class="dev-tools">
  <h3>لوحة التحرير</h3>

  <input id="title" placeholder="عنوان">
  <input id="image" placeholder="صورة">
  <textarea id="content" placeholder="محتوى"></textarea>

  <button @click="publish">نشر</button>
</div>

<!-- NEWS -->
<div v-if="loading">جاري التحميل...</div>

<div v-for="n in news" class="news-card">
  <img v-if="n.image_url" :src="n.image_url">
  <h2>{{n.title}}</h2>
  <p>{{n.content}}</p>
  <small>{{n.author_name}}</small>

  <button v-if="dev" @click="remove(n.id)">حذف</button>
</div>

</main>

</div>

<script>
const { createApp } = Vue;

createApp({
data(){
return{
  WORKER_URL:"https://ivanova-news.vladimirachraf3.workers.dev",

  news:[],
  loading:true,

  dev:localStorage.getItem("grosmen_dev"),

  login:{
    show:false,
    username:"",
    pass_code:"",
    error:""
  }
}
},

mounted(){
this.fetchNews();
},

methods:{

async api(path,options={}){
  const r = await fetch(this.WORKER_URL+path,{
    headers:{"Content-Type":"application/json"},
    ...options
  });
  if(!r.ok) throw new Error();
  return await r.json();
},

async fetchNews(){
  this.news = await this.api("/api/news");
  this.loading=false;
},

async doLogin(){
  try{
    await this.api("/api/login",{
      method:"POST",
      body:JSON.stringify({
        username:this.login.username,
        pass_code:this.login.pass_code
      })
    });

    localStorage.setItem("grosmen_dev",this.login.username);
    this.dev=this.login.username;
    this.login.show=false;

  }catch{
    this.login.error="خطأ في البيانات";
  }
},

logout(){
  localStorage.removeItem("grosmen_dev");
  this.dev=null;
},

async publish(){
  await this.api("/api/news/add",{
    method:"POST",
    body:JSON.stringify({
      title:document.getElementById("title").value,
      content:document.getElementById("content").value,
      image_url:document.getElementById("image").value,
      author:this.dev
    })
  });

  this.fetchNews();
},

async remove(id){
  await this.api("/api/news/delete",{
    method:"DELETE",
    body:JSON.stringify({id})
  });

  this.fetchNews();
}

}

}).mount("#app");

/* APPS MENU */
function toggleAppsMenu(){
  document.getElementById("appsDropdown").classList.toggle("active");
}

window.onclick=function(e){
  if(!e.target.closest(".apps-menu-btn") && !e.target.closest(".apps-dropdown")){
    document.getElementById("appsDropdown").classList.remove("active");
  }
}
</script>

</body>
</html>
